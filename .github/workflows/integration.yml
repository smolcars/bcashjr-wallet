name: Regtest integration

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  regtest:
    name: Core + BLAKE Knots + mempool
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.6"
          cache: true
      - name: Install dependencies
        run: deno install --frozen
      - name: Validate and test wallet
        run: |
          deno task check
          deno task lint
          deno task test
          deno task ui:build
      - name: Run isolated regtest integration suite
        run: deno task test:integration
      - name: Upload node and explorer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regtest-logs
          path: artifacts/integration/
          if-no-files-found: ignore
          retention-days: 7
